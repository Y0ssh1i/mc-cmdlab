name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - run: python -m cmdlab lint examples/teams_and_scores.json --version 1.20.1
      - run: python -m cmdlab lint examples/complex_commands.json --version 1.20.1
