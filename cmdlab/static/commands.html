<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mc-cmdlab Commands</title>
<style>
:root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e3e3e0; --acc:#2f6f4e; --ok:#2f7d4a; --ng:#b3261e; --code:#f1f1ee; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --card:#1f2024; --ink:#ececec; --sub:#a0a0a6; --line:#2e2f34; --acc:#6fc49a; --ok:#6fc49a; --ng:#ff8a80; --code:#26272c; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
a { color:var(--acc); }
header { padding:20px 24px 8px; } h1 { margin:0; font-size:22px; } header p { margin:4px 0 0; color:var(--sub); }
nav.toc { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 24px; display:flex; gap:6px; flex-wrap:wrap; }
nav.toc a { text-decoration:none; font-size:13px; padding:3px 10px; border:1px solid var(--line); border-radius:99px; color:var(--ink); background:var(--card); }
nav.toc a:hover { border-color:var(--acc); color:var(--acc); }
nav.toc a.here { background:var(--acc); border-color:var(--acc); color:#fff; }
main { max-width:1100px; margin:0 auto; padding:16px 24px 48px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 10px; }
input, select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
#q { flex:1 1 220px; min-width:0; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.chip { font-size:12.5px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
.chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
table { width:100%; border-collapse:collapse; font-size:13.5px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--sub); font-weight:600; }
code { background:var(--code); padding:1px 5px; border-radius:4px; font:13px ui-monospace, Consolas, monospace; word-break:break-word; }
.tablewrap { overflow-x:auto; }
.tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--sub); margin-left:4px; }
@media (max-width: 700px) { main { padding:12px 16px; } nav.toc { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <h1>mc-cmdlab — コマンド説明書</h1>
    <label class="check" style="margin:0"><span>言語</span>
      <select id="lang" style="width:auto"><option value="ja">日本語</option><option value="en">English</option></select></label>
  </div>
  <p>マイクラ(Java 版)のコマンドを1つずつ説明します。入力の補完にも使います。</p>
</header>
<nav class="toc">
  <a href="/">メイン</a>
  <a href="/editor">コマンド設定</a>
  <a href="/guide">使い方</a>
  <a href="/commands" class="here">コマンド説明書</a>
</nav>
<main>
  <div class="filters">
    <input id="q" placeholder="コマンド名・説明で検索">
    <select id="cat"><option value="">すべての分類</option></select>
    <select id="ver"><option value="">すべての版</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tablewrap">
    <table id="tbl"><thead><tr><th>コマンド</th><th>構文</th><th>説明</th><th>版</th></tr></thead><tbody></tbody></table>
  </div>
  <p id="count" style="color:var(--sub);font-size:13px"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
let DATA = [];
let LANG = 'ja';
async function load() {
  const j = await (await fetch('/commands.json')).json();
  DATA = j.commands || [];
  const cats = [...new Set(DATA.map(c => c.category))];
  for (const c of cats) { const o = document.createElement('option'); o.value = c; o.textContent = c; $('cat').appendChild(o); }
  const vers = [...new Set(DATA.flatMap(c => c.versions))];
  for (const v of vers) { const o = document.createElement('option'); o.value = v; o.textContent = v; $('ver').appendChild(o); }
  render();
}
function render() {
  const q = ($('q').value || '').toLowerCase();
  const cat = $('cat').value;
  const ver = $('ver').value;
  const rows = DATA.filter(c => {
    if (cat && c.category !== cat) return false;
    if (ver && !(c.versions || []).includes(ver)) return false;
    if (q) {
      const hay = (c.name + ' ' + c.syntax + ' ' + (LANG==='ja'?c.desc_ja:c.desc_en)).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const tb = $('tbl').querySelector('tbody');
  tb.innerHTML = '';
  for (const c of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><code></code></td><td><code></code></td><td></td><td></td>';
    tr.children[0].querySelector('code').textContent = '/' + c.name;
    tr.children[1].querySelector('code').textContent = c.syntax;
    tr.children[2].textContent = LANG === 'ja' ? c.desc_ja : c.desc_en;
    tr.children[3].textContent = (c.versions || []).join(', ');
    tb.appendChild(tr);
  }
  $('count').textContent = rows.length + ' / ' + DATA.length;
}
['q','cat','ver'].forEach(id => { $(id).addEventListener('input', render); $(id).addEventListener('change', render); });
$('lang').addEventListener('change', () => { LANG = $('lang').value; try { localStorage.setItem('cmdlab_lang', LANG); } catch(e){} render(); });
try { LANG = localStorage.getItem('cmdlab_lang') || 'ja'; } catch(e){}
$('lang').value = LANG;
load();
</script>
</body>
</html>
