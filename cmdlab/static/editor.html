<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mc-cmdlab Editor</title>
<style>
:root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e3e3e0; --acc:#2f6f4e; --ok:#2f7d4a; --ng:#b3261e; --warn:#a56500; --code:#f1f1ee;
  --imp:#d9772b; --chn:#3f9b5a; --rep:#7b55c7; --rs:#c62828; --soft:rgba(127,127,127,.10); }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --card:#1f2024; --ink:#ececec; --sub:#a0a0a6; --line:#2e2f34; --acc:#6fc49a; --ok:#6fc49a; --ng:#ff8a80; --warn:#f0b75a; --code:#26272c; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
a { color:var(--acc); }
header { padding:16px 24px 4px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
h1 { margin:0; font-size:22px; } h1 small { font-size:15px; color:var(--sub); font-weight:500; margin-left:8px; }
.hright { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.wrap { padding:8px 24px 32px; display:flex; flex-direction:column; gap:12px; }
@media (max-width: 900px) { .wrap { padding:8px 16px 24px; } header { padding:12px 16px 4px; } }
section, .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
h2 { margin:0 0 8px; font-size:16px; } h3 { margin:12px 0 6px; font-size:14px; }
label.f { display:block; color:var(--sub); font-size:12px; margin:6px 0 2px; }
input, select, textarea { width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; min-width:0; }
input[type=checkbox] { width:auto; }
textarea { font:13px/1.5 ui-monospace, Consolas, monospace; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size:12.5px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.row > .grow { flex:1 1 160px; }
button { padding:6px 12px; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
button.ghost { background:transparent; color:var(--acc); }
button.mini { padding:2px 8px; font-size:12px; border-radius:6px; background:transparent; color:var(--sub); border-color:var(--line); }
button.mini:hover { color:var(--acc); border-color:var(--acc); }
button.danger { border-color:var(--ng); color:var(--ng); background:transparent; }
button:disabled { opacity:.5; cursor:wait; }
.status { font-size:13px; color:var(--sub); white-space:pre-wrap; }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--sub); white-space:nowrap; }
.pill.on { border-color:var(--ok); color:var(--ok); }
.check { display:inline-flex; gap:6px; align-items:center; font-size:13px; color:var(--ink); }
.help { font-size:13px; color:var(--sub); margin:0 0 8px; }
.ok { color:var(--ok); font-weight:600; } .ng { color:var(--ng); font-weight:600; } .warn { color:var(--warn); font-weight:600; }
.dirty { color:var(--warn); font-size:12px; }

/* project bar */
.pbar { display:grid; grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(110px, 1fr)); gap:4px 10px; align-items:end; }
@media (max-width: 1100px) { .pbar { grid-template-columns: 1fr 1fr; } }
.msgs { margin-top:8px; font-size:13px; } .msgs li { cursor:pointer; } .msgs ul { margin:4px 0; padding-left:20px; }

/* run bar */
.runbar { display:flex; gap:10px 18px; flex-wrap:wrap; align-items:flex-end; }
.runbar .grp { display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; }
.sep { width:1px; align-self:stretch; background:var(--line); }

/* main layout */
.main { display:grid; grid-template-columns: 290px minmax(0, 1fr); gap:12px; align-items:start; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
aside { display:flex; flex-direction:column; gap:12px; min-width:0; }
.list { list-style:none; margin:0; padding:0; }
.list li { border:1px solid transparent; border-radius:8px; padding:5px 8px; cursor:pointer; margin:2px 0; }
.list li:hover { background:var(--soft); }
.list li.sel { border-color:var(--acc); background:var(--soft); }
.list .lt { display:flex; gap:6px; align-items:center; justify-content:space-between; }
.list .lab { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list .sub { font-size:11.5px; color:var(--sub); font-family: ui-monospace, Consolas, monospace; }
.list .tools { display:flex; gap:4px; margin-top:4px; }
.badges { display:flex; gap:3px; flex-wrap:wrap; flex-shrink:0; }
.b { font-size:10.5px; padding:0 6px; border-radius:4px; color:#fff; line-height:17px; white-space:nowrap; }
.b.function { background:#4a6fa5; } .b.blocks { background:var(--imp); } .b.steps { background:#2f8f8f; }
.b.tick { background:#9a3c6a; } .b.load { background:#6a6a2f; } .b.err { background:var(--ng); } .b.rep { background:var(--rep); }
.addrow { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }

/* tabs */
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:-4px 0 12px; flex-wrap:wrap; }
.tabs button { background:transparent; color:var(--sub); border:none; border-bottom:3px solid transparent; border-radius:0; padding:6px 12px; }
.tabs button.on { color:var(--acc); border-bottom-color:var(--acc); font-weight:600; }
.edhead { display:grid; grid-template-columns: minmax(160px, 2fr) minmax(120px, 1fr) auto; gap:4px 10px; align-items:end; margin-bottom:8px; }
@media (max-width: 700px) { .edhead { grid-template-columns: 1fr; } }

/* function editor */
.code { display:flex; border:1px solid var(--line); border-radius:8px; background:var(--bg); overflow:hidden; height:380px; }
.code .gut { flex:0 0 42px; overflow:hidden; background:var(--code); color:var(--sub); text-align:right; padding:8px 6px 8px 0; font:13px/20px ui-monospace, Consolas, monospace; user-select:none; }
.code .gut div { height:20px; } .code .gut .bad { color:#fff; background:var(--ng); border-radius:3px; } .code .gut .wn { color:#fff; background:var(--warn); border-radius:3px; }
.code textarea { flex:1; border:none; border-radius:0; resize:none; padding:8px; font:13px/20px ui-monospace, Consolas, monospace; white-space:pre; overflow:auto; height:100%; background:transparent; }
.chips { display:flex; gap:4px; flex-wrap:wrap; align-items:center; font-size:13px; }
.chip { border:1px solid var(--line); border-radius:99px; padding:0 8px; font-size:12px; cursor:pointer; background:var(--bg); }
.chip:hover { border-color:var(--acc); color:var(--acc); }
.findings { font-size:13px; margin:6px 0 0; padding-left:18px; }

/* blocks editor */
.views { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:8px; }
@media (max-width: 1000px) { .views { grid-template-columns: 1fr; } }
.view { border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg); min-width:0; }
.view h3 { margin:0 0 4px; font-size:13px; } .view .vh { font-size:12px; color:var(--sub); margin:0 0 4px; }
.view svg { width:100%; height:auto; max-height:420px; display:block; }
.view svg .blk { cursor:pointer; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin-top:8px; align-items:center; }
.sw { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--sub); font-weight:500; font-size:12px; }
#blkTable tbody tr { cursor:pointer; } #blkTable tbody tr:hover { background:var(--soft); } #blkTable tr.sel { outline:2px solid var(--acc); }
td code, .cmd { background:var(--code); padding:1px 4px; border-radius:4px; word-break:break-all; font:12.5px ui-monospace, Consolas, monospace; }
.bform { border:2px solid var(--acc); border-radius:10px; padding:10px 12px; margin-top:10px; }
.grid4 { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:4px 10px; }
.grid3 { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:4px 10px; }
@media (max-width: 700px) { .grid4, .grid3 { grid-template-columns: 1fr 1fr; } }
.sq { display:inline-block; width:16px; height:16px; border-radius:3px; vertical-align:-3px; color:#fff; font-size:10px; text-align:center; line-height:16px; }
.sq.impulse { background:var(--imp); } .sq.chain { background:var(--chn); } .sq.repeat { background:var(--rep); }

/* step flow */
.flow { display:flex; flex-direction:column; align-items:stretch; }
.arrow { text-align:center; color:var(--sub); font-size:18px; line-height:20px; height:22px; user-select:none; }
.st { border:1px solid var(--line); border-left:6px solid #999; border-radius:10px; background:var(--card); padding:8px 10px; }
.st.call { border-left-color:#4a6fa5; background:linear-gradient(90deg, rgba(74,111,165,.08), transparent 60%); }
.st.call.blocks { border-left-color:var(--imp); background:linear-gradient(90deg, rgba(217,119,43,.09), transparent 60%); }
.st.call.steps { border-left-color:#2f8f8f; background:linear-gradient(90deg, rgba(47,143,143,.09), transparent 60%); }
.st.do { border-left-color:#2f8f8f; } .st.run { border-left-color:#555; } .st.wait { border-left-color:#c9a227; border-style:dashed solid dashed solid; } .st.raw { border-left-color:#999; }
.st.drag { opacity:.4; } .st.over { outline:2px dashed var(--acc); }
.st .top { display:flex; gap:8px; align-items:center; }
.st .num { flex:0 0 auto; font:600 12px ui-monospace, Consolas, monospace; background:var(--code); border-radius:6px; padding:1px 6px; color:var(--sub); }
.st .kind { flex:0 0 auto; font-size:12px; font-weight:600; color:var(--sub); }
.st .sum { flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere; }
.st .tools { display:flex; gap:3px; flex:0 0 auto; }
.st .handle { cursor:grab; color:var(--sub); user-select:none; }
.st .prev { margin:6px 0 0 30px; font-size:12px; color:var(--sub); }
.st .prev .cmd { display:block; margin:1px 0; white-space:pre-wrap; }
.st .exp { margin:4px 0 0 30px; display:flex; gap:4px; flex-wrap:wrap; }
.st .exp span { font-size:11.5px; border-radius:4px; padding:0 6px; background:rgba(47,125,74,.12); color:var(--ok); }
.st .body { margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; }
.st .res { flex:0 0 auto; font-size:12px; }
.st.selrun { box-shadow: 0 0 0 2px var(--acc) inset; }

/* flow view */
.fv { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:12px; align-items:start; }
@media (max-width: 1100px) { .fv { grid-template-columns: 1fr; } }
.tl { width:100%; border-collapse:separate; border-spacing:0; }
.tl td { border-bottom:1px solid var(--line); padding:5px 6px; vertical-align:middle; }
.tl .n { font:600 12px ui-monospace, Consolas, monospace; color:var(--sub); width:34px; text-align:right; }
.tl .t { font:11.5px ui-monospace, Consolas, monospace; color:var(--sub); width:58px; white-space:nowrap; }
.tl .grp { font-size:11.5px; color:#fff; border-radius:4px; padding:0 6px; white-space:nowrap; }
.tl .lane { width:22px; padding:0; position:relative; border-bottom:none; }
.tl .lane i { position:absolute; left:8px; top:0; bottom:0; width:6px; border-radius:2px; }
.tl .lane i.tick { background:#9a3c6a; } .tl .lane i.rep { background:var(--rep); }
.tl .lane i.start { top:40%; }
.tl tr.pre td { background:var(--soft); font-size:13px; }
.tl tr.waitrow td.d { color:#8a6d00; }
.tl th { font-size:12px; color:var(--sub); font-weight:500; text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
.tl th.lh { padding:4px 0; text-align:center; width:22px; }
.lsw { display:inline-block; min-width:16px; height:16px; border-radius:3px; color:#fff; font-size:10px; line-height:16px; text-align:center; padding:0 2px; }
.lsw.tick { background:#9a3c6a; } .lsw.rep { background:var(--rep); }
.lanes { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--sub); margin:0 0 6px; }
.bg { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--bg); margin-bottom:10px; }
.bg h3 { margin:0 0 6px; }
.tree { list-style:none; padding-left:14px; margin:2px 0; font-size:13px; } .tree li::before { content:"↳ "; color:var(--sub); }
.tree.root { padding-left:0; } .tree.root > li::before { content:""; }

/* results (same look as the main page) */
.story { margin:0 0 12px; padding-left:22px; font-size:14px; } .story li { margin:4px 0; cursor:pointer; }
.story li:hover, #results tbody tr:hover { background:rgba(127,127,127,.12); } #results tbody tr { cursor:pointer; }
.story li.sel, #results tbody tr.sel { outline:2px solid var(--acc); } .story li.ng { color:var(--ng); } .where { color:var(--ng); font-weight:600; }
.loaderr { border:2px solid var(--ng); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
.loaderr li { font:12.5px ui-monospace, Consolas, monospace; }
pre.log { background:var(--code); border-radius:8px; padding:8px; max-height:200px; overflow:auto; font-size:12px; white-space:pre-wrap; }
.mc { position:relative; height:420px; border-radius:10px; overflow:hidden; margin-top:10px;
  background: linear-gradient(#7fb2ff 0%, #a9cbff 55%, #6a9b3c 55%, #4e7a2a 100%); font-family: ui-monospace, Consolas, monospace; color:#fff; text-shadow: 2px 2px 0 #3f3f3f; }
.mc-boss { position:absolute; top:8px; left:50%; transform:translateX(-50%); width:60%; text-align:center; font-size:13px; }
.mc-boss .bar { height:6px; background:#333; margin:2px 0 8px; } .mc-boss .fill { height:100%; }
.mc-title { position:absolute; top:34%; width:100%; text-align:center; } #mcTitle { font-size:40px; font-weight:700; } #mcSub { font-size:18px; }
.mc-side { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.35); font-size:13px; min-width:150px; text-shadow:none; }
.mc-side .h { text-align:center; background:rgba(0,0,0,.25); padding:2px 6px; } .mc-side .r { display:flex; justify-content:space-between; gap:14px; padding:0 6px; } .mc-side .r b { color:#ff5555; font-weight:400; }
.mc-tab { position:absolute; top:58px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:6px; font-size:13px; display:none; min-width:220px; text-shadow:none; }
.mc-tab div { background:rgba(255,255,255,.12); margin:2px 0; padding:1px 6px; }
.mc-chat { position:absolute; left:6px; bottom:64px; width:52%; font-size:13px; } .mc-chat div { background:rgba(0,0,0,.45); padding:1px 4px; text-shadow:none; }
.mc-action { position:absolute; bottom:64px; width:100%; text-align:center; font-size:14px; }
.mc-extra { position:absolute; left:6px; top:6px; max-width:40%; font-size:12px; text-shadow:none; } .mc-extra div { background:rgba(0,0,0,.45); padding:1px 5px; margin-bottom:2px; }
.mc-window { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#c6c6c6; color:#333; border:3px solid #555; padding:6px; font-size:12px; text-shadow:none; display:none; max-width:60%; }
.mc-window .slots { display:grid; grid-template-columns:repeat(9, 1fr); gap:2px; margin-top:4px; } .mc-window .slots div { background:#8b8b8b; color:#fff; min-height:30px; font-size:10px; padding:2px; overflow:hidden; }
.mc-hud { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:364px; max-width:90%; height:44px; background:rgba(0,0,0,.4); border:2px solid #222; font-size:12px; text-align:center; line-height:40px; text-shadow:none; }
.c0{color:#000}.c1{color:#00a}.c2{color:#0a0}.c3{color:#0aa}.c4{color:#a00}.c5{color:#a0a}.c6{color:#fa0}.c7{color:#aaa}.c8{color:#555}.c9{color:#55f}.ca{color:#5f5}.cb{color:#5ff}.cc{color:#f55}.cd{color:#f5f}.ce{color:#ff5}.cf{color:#fff}
@media (max-width: 600px) { .pbar { grid-template-columns: 1fr; } .runbar .sep, .row .sep { display:none; } .grid4, .grid3 { grid-template-columns: 1fr; } }
.pbar > div, .grid4 > div, .grid3 > div, .edhead > div { min-width:0; }
select { max-width:100%; text-overflow:ellipsis; }
.list .lab { min-width:0; }
.empty { color:var(--sub); font-size:14px; padding:16px; text-align:center; border:1px dashed var(--line); border-radius:10px; }
</style>
</head>
<body>
<header>
  <h1>mc-cmdlab <small data-i="subtitle">コマンド設定ページ</small></h1>
  <div class="hright">
    <a href="/" id="lnkMain" data-i="back_main">← メインページ(サーバー・プレイヤー・1回きりの台本)</a>
    <label class="check"><span data-i="lang">言語</span>
      <select id="lang" style="width:auto"><option value="ja">日本語</option><option value="en">English</option></select></label>
  </div>
</header>
<div class="wrap">
  <!-- 1. project bar -->
  <section>
    <div class="pbar">
      <div><label class="f" data-i="l_open">プロジェクトを開く(例・保存したもの)</label>
        <div class="row" style="flex-wrap:nowrap"><select id="projPick"></select><button class="ghost" id="btnOpen" data-i="b_open">開く</button></div></div>
      <div><label class="f" data-i="l_title">題名</label><input id="pTitle"></div>
      <div><label class="f" data-i="l_ns">名前空間(関数名の前)</label><input id="pNs" class="mono"></div>
      <div><label class="f" data-i="l_ver">マイクラの版</label><select id="pVer"></select></div>
      <div><label class="f" data-i="l_players">テスト用プレイヤー</label><input id="pPlayers" data-ip="ph_players" placeholder="Alice, Bob"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" id="btnNew" data-i="b_new">新規</button>
      <span class="sep"></span>
      <input id="saveName" class="mono" style="width:180px" data-ip="ph_savename" placeholder="保存名">
      <button id="btnSave" data-i="b_save">保存</button>
      <button class="ghost" id="btnCheck" data-i="b_check">点検する</button>
      <button class="ghost" id="btnExport" data-i="b_export">データパックに書き出す</button>
      <span id="dirty" class="dirty"></span>
      <span id="pStatus" class="status"></span>
    </div>
    <div id="msgs" class="msgs"></div>
  </section>

  <!-- 5. run bar -->
  <section>
    <h2 data-i="h_run">テストを流す</h2>
    <div class="runbar">
      <div class="grp">
        <div><label class="f" data-i="l_target_sc">流すシナリオ</label><select id="runSc" style="min-width:200px"></select></div>
        <button id="btnRunSc" data-i="b_run_sc">▶ シナリオ全体を流す</button>
      </div>
      <div class="grp">
        <button class="ghost" id="btnRunMod" data-i="b_run_mod">▶ 選んだ部品だけ流す</button>
      </div>
      <div class="grp">
        <div><label class="f" data-i="l_only">チェックした段(展開後の番号)</label><input id="runOnly" class="mono" style="width:130px" data-ip="ph_only" placeholder="1-3,6"></div>
        <button class="ghost" id="btnRunOnly" data-i="b_run_only">▶ チェックした段だけ流す</button>
      </div>
      <span class="sep"></span>
      <div class="grp">
        <span id="srvPill" class="pill">-</span>
        <button class="mini" id="btnStart" data-i="b_start">サーバー起動</button>
        <button class="mini" id="btnStop" data-i="b_stop">止める</button>
        <button class="mini" id="btnPlayers" data-i="b_players">プレイヤーを入れる</button>
        <label class="check"><input type="checkbox" id="opPlayers"><span data-i="l_op">OP にする</span></label>
      </div>
    </div>
    <div class="status" id="runStatus" style="margin-top:6px"></div>
  </section>

  <div class="main">
    <!-- 2. modules, 3. scenarios -->
    <aside>
      <section>
        <h2 data-i="h_modules">コマンド集の部品</h2>
        <p class="help" data-i="help_modules">ゲームの部分ごとの部品。関数・コマンドブロックの列・プレイヤーの動きの3種類。</p>
        <ul class="list" id="modList"></ul>
        <div class="addrow">
          <button class="mini" id="addFn" data-i="add_fn">+ 関数</button>
          <button class="mini" id="addBl" data-i="add_bl">+ コマンドブロック</button>
          <button class="mini" id="addSt" data-i="add_st">+ プレイヤーの動き</button>
        </div>
      </section>
      <section>
        <h2 data-i="h_scen">シナリオ</h2>
        <p class="help" data-i="help_scen">部品をどの順で呼ぶか。試したい流れごとに1つ。</p>
        <ul class="list" id="scList"></ul>
        <div class="addrow"><button class="mini" id="addSc" data-i="add_sc">+ シナリオ</button></div>
      </section>
    </aside>

    <section>
      <div class="tabs">

function newProject() {
  if (DIRTY && !confirm(t('confirm_new'))) return;
  P = { version: $('pVer').value || '1.20.1', title: t('new_title'), namespace:'game', player_names:['Alice', 'Bob'],
    modules:[{ id:'setup', label: LANG() === 'en' ? 'Setup' : '準備', kind:'function', load:true, lines:['scoreboard objectives add game dummy'] }],
    scenarios:[{ id:'main', label: t('new_sc') + ' 1', steps:[{ call:'setup' }] }] };
  NAME = 'untitled'; CHECK = null; LAST = []; LASTRUN = null; LOADERR = [];
  SEL = { type:'module', id:'setup' }; fillProjectBar(); dirty(true); renderAll(); setUrl();
}
async function runCheck(quiet) {
  try {
    CHECK = await call('/api/project/check', { project:P });
    const box = $('msgs'); box.innerHTML = '';
    const probs = CHECK.problems || [], lint = CHECK.lint || [];
    if (!quiet || probs.length || lint.some((x) => x.level === 'error')) {
      if (!probs.length && !lint.length) box.appendChild(h('div', { class:'ok' }, '✓ ' + t('check_ok')));
      if (probs.length) box.appendChild(h('div', {}, h('b', { class:'ng' }, t('check_probs')), h('ul', {}, probs.map((p) => h('li', { class:'ng' }, p)))));
      if (lint.length) box.appendChild(h('div', {}, h('b', {}, t('check_lint')), h('ul', {}, lint.map((f) => {
        const id = String(f.file).replace(/^module /, '');
        return h('li', { class: f.level === 'error' ? 'ng' : 'warn', onclick:() => modById(id) && select('module', id) }, `[${f.level}] ${f.file} L${f.line}: ${f.message}`);
      }))));
    }
    renderLists(); if (TAB === 'edit') renderEditor();
  } catch (e) { status(t('err') + e.message, 'ng'); }
}

// ---------------- render all ----------------
function applyLang() {
  document.documentElement.lang = LANG();
  document.querySelectorAll('[data-i]').forEach((el) => { const v = I18N[LANG()][el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-ip]').forEach((el) => { const v = I18N[LANG()][el.dataset.ip]; if (typeof v === 'string') el.placeholder = v; });
  dirty(DIRTY); fillPicker(); renderAll(); refreshStatus();
}
function renderAll() {
  if (!P) return;
  renderLists();
  for (const [id, k] of [['tabEdit', 'edit'], ['tabFlow', 'flow'], ['tabRes', 'res']]) $(id).classList.toggle('on', TAB === k);
  $('paneEdit').style.display = TAB === 'edit' ? '' : 'none';
  $('paneFlow').style.display = TAB === 'flow' ? '' : 'none';
  $('paneRes').style.display = TAB === 'res' ? '' : 'none';
  if (TAB === 'edit') renderEditor();
  if (TAB === 'flow') renderFlow();
  renderResults();
}

// ---------------- wiring ----------------
$('tabEdit').onclick = () => { TAB = 'edit'; renderAll(); };
$('tabFlow').onclick = () => { TAB = 'flow'; renderAll(); };
$('tabRes').onclick = () => { TAB = 'res'; renderAll(); };
$('lang').onchange = () => { try { localStorage.setItem('cmdlab_lang', LANG()); } catch (e) { /* */ } applyLang(); setUrl(); };
$('btnOpen').onclick = async () => { if (DIRTY && !confirm(t('confirm_open'))) return; try { await openProject($('projPick').value); } catch (e) { status(t('err') + e.message, 'ng'); } };
$('btnNew').onclick = newProject;
$('btnSave').onclick = async (e) => {
  const name = ($('saveName').value.trim() || NAME || 'untitled').replace(/[\\/:*?"<>|]/g, '_');
  e.target.disabled = true;
  try { const j = await call('/api/project/save', { name, project:P }); NAME = name; dirty(false); status(t('saved', j.saved), 'ok'); await loadProjects(); $('projPick').value = name; setUrl(); }
  catch (er) { status(t('err') + er.message, 'ng'); } finally { e.target.disabled = false; }
};
$('btnCheck').onclick = () => runCheck(false);
$('btnExport').onclick = async (e) => { e.target.disabled = true; try { const j = await call('/api/project/export', { project:P }); status(t('exported', j.out), 'ok'); } catch (er) { status(t('err') + er.message, 'ng'); } finally { e.target.disabled = false; } };
$('pTitle').oninput = (e) => setKey(P, 'title', e.target.value);
$('pNs').onchange = (e) => { setKey(P, 'namespace', e.target.value.trim() || 'game'); renderAll(); };
$('pVer').onchange = (e) => { setKey(P, 'version', e.target.value); runCheck(true); };
$('pPlayers').onchange = (e) => { setKey(P, 'player_names', e.target.value.split(/[\s,]+/).filter(Boolean)); renderAll(); };
$('addFn').onclick = () => addModule('function');
$('addBl').onclick = () => addModule('blocks');
$('addSt').onclick = () => addModule('steps');
$('addSc').onclick = () => { const sc = { id: uniqueId('scenario', scens()), label: t('new_sc') + ' ' + (scens().length + 1), steps: [] }; P.scenarios.push(sc); dirty(); select('scenario', sc.id); };
$('runSc').onchange = () => { updateOnly(); if (TAB === 'flow' && SEL && SEL.type === 'scenario') select('scenario', $('runSc').value); };
$('btnRunSc').onclick = (e) => run('scenario', e.target);
$('btnRunMod').onclick = (e) => run('module', e.target);
$('btnRunOnly').onclick = (e) => run('only', e.target);
$('btnStart').onclick = (e) => srv(e.target, '/api/start', { version: P ? P.version : undefined });
$('btnStop').onclick = (e) => srv(e.target, '/api/stop', {});
$('btnPlayers').onclick = (e) => srv(e.target, '/api/players', { count: Math.max(1, players().length), names: players().join(',') || null, op: $('opPlayers').checked });
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  const q = new URLSearchParams(location.search);
  try { $('lang').value = localStorage.getItem('cmdlab_lang') || 'ja'; } catch (e) { /* */ }
  if (q.get('lang')) $('lang').value = q.get('lang') === 'en' ? 'en' : 'ja';
  document.querySelectorAll('[data-i]').forEach((el) => { const v = I18N[LANG()][el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-ip]').forEach((el) => { const v = I18N[LANG()][el.dataset.ip]; if (typeof v === 'string') el.placeholder = v; });
  try { const v = await (await fetch('/api/versions')).json(); for (const x of v.supported) $('pVer').appendChild(h('option', { value:x }, x)); } catch (e) { /* */ }
  await loadProjects();
  const name = q.get('project') || (PROJECTS[0] || {}).name;
  if (name) { try { await openProject(name); } catch (e) { status(t('err') + e.message, 'ng'); newProject(); } } else newProject();
  if (q.get('module') && modById(q.get('module'))) SEL = { type:'module', id:q.get('module') };
  if (q.get('scenario') && scById(q.get('scenario'))) SEL = { type:'scenario', id:q.get('scenario') };
  const view = q.get('view');
  if (view === 'blocks' && !(SEL && SEL.type === 'module' && kindOf(modById(SEL.id)) === 'blocks')) { const b = mods().find((m) => kindOf(m) === 'blocks'); if (b) SEL = { type:'module', id:b.id }; }
  if (view === 'flow') TAB = 'flow';
  if (view === 'results') TAB = 'res';
  if (q.get('block')) SELBLOCK = (+q.get('block') || 1) - 1;
  if (q.get('open')) { const sc = SEL && SEL.type === 'scenario' ? scById(SEL.id) : (SEL ? modById(SEL.id) : null); const st = sc && (sc.steps || [])[(+q.get('open') || 1) - 1]; if (st) OPEN.add(st); }
  if (q.get('check')) { const sc = scById($('runSc').value) || scens()[0]; if (sc) q.get('check').split(',').forEach((n) => { const st = sc.steps[+n - 1]; if (st) CHECKED.add(st); }); }
  if (q.get('result') === '1') { try { LAST = await (await fetch('/api/last')).json(); TAB = 'res'; } catch (e) { /* */ } }
  renderAll(); setUrl();
  refreshStatus(); setInterval(refreshStatus, 4000);
})();
</script>
</body>
</html>
